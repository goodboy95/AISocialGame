services:
  backend:
    image: eclipse-temurin:25-jre
    container_name: aisocial-backend
    ports:
      - "11031:11031"
    working_dir: /app
    command: ["sh", "-c", "test -f /app/env.local && test \"$$(stat -c '%a' /app/env.local)\" = 600 || { echo 'env.local must exist with mode 0600' >&2; exit 1; }; . /app/bin/load-env-file.sh; load_one_env_file /app/env.local && exec java $${JAVA_OPTS:-} -jar /app/app.jar"]
    volumes:
      - ./backend/target/ai-social-game-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
      - ./backend/src/main/resources/application.yml:/app/config/application.yml:ro
      - ./backend/src/main/resources/prompt.yml:/app/config/prompt.yml:ro
      - type: bind
        source: ./env.local
        target: /app/env.local
        read_only: true
        bind:
          create_host_path: false
      - ./docker/load-env-file.sh:/app/bin/load-env-file.sh:ro
      - /home/duwei/aienie-runtime/observability/data/aisocialgame/logs:/app/logs
      - /home/duwei/aienie-runtime/observability/data/aisocialgame/records:/app/records
    extra_hosts:
      - "localbase.testhut.top:host-gateway"
      - "localuserservice.testhut.top:host-gateway"
      - "localpayservice.testhut.top:host-gateway"
      - "localaiservice.testhut.top:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aisocial-frontend
    depends_on:
      - backend
    ports:
      - "11030:11030"
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-5}
